# Overfitting sanity check: single LIBERO episode, high-capacity, expect loss → 0
dataset_class: true

dataset:
  _target_: libero_data.LiberoDataset
  path: /home/cyborg/WM/LIBERO-datasets/libero_10
  frameskip: 5
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
