defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
subdir: ${hydra:job.id}

# Redirect Hydra outputs
hydra:
  run:
    dir: output/hydra/${hydra:job.id}

wandb:
  enabled: False  # Set True to enable WandB logging
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224

trainer:
  default_root_dir: output/lightning
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 2
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

planner:
  ckpt: pusht                    # pretrained WM checkpoint name
  num_queries: 8                 # N candidate action sequences
  num_layers: 3                  # transformer decoder layers
  num_heads: 8                   # attention heads
  mlp_dim: 1024                  # FFN hidden dim
  horizon: 8                     # output series length T (action₁, ..., action_T)
  action_dim: null               # raw action dim (null = auto-detect from WM)
  dropout: 0.1
  diversity_weight: 0.1          # λ for DETR-style diversity loss
